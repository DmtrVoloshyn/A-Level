version: '3.8'

services:
  identity:
    container_name: lde.identity
    build:
      context: .
      dockerfile: Identity/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5002
      - MvcUrl=http://www.alevelwebsite.com
      - CatalogApi=http://www.alevelwebsite.com:5000
      - BasketApi=http://www.alevelwebsite.com:5003
    ports:
      - 5002:5002
  basket.api:
    container_name: lde.basket.api
    build:
      context: .
      dockerfile: Basket.Host/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5003
      - Authorization__Authority=http://www.alevelwebsite.com:5002
      - Redis__Host=www.alevelwebsite.com:6380
      - Redis__CacheTimeout=00:00:10
      - PathBase=http://www.alevelwebsite.com:5003
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=15672
      - RABBITMQ_USER=user
      - RABBITMQ_PASS=password
    depends_on:
      - redis
      - rabbitmq
    ports:
      - 5003:5003
  catalog.api:
    container_name: lde.catalog.api
    build:
      context: .
      dockerfile: Catalog/Catalog.Host/Dockerfile
    environment:
       - ASPNETCORE_ENVIRONMENT=Development
       - ASPNETCORE_URLS=http://+:8000
    depends_on:
      - postgres
      - rabbitmq
    ports:
      - 8000:8000
  
  nginx:
    image: nginx
    container_name: lde.nginx
    ports:
      - 80:80
  
  pgadmin4:
    image: dpage/pgadmin4
    container_name: lde.pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: user@domain.com
      PGADMIN_DEFAULT_PASSWORD: postgres
    depends_on:
      - postgres
    ports:
      - 8001:80 
  
  postgres:
    image: postgres
    container_name: lde.postgres
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - 5433:5432
  
  redis:
    image: redis
    container_name: lde.redis
    ports:
      - 6380:6379
  
  rabbitmq:
    image: rabbitmq:3-management
    container_name: lde.rabbitmq
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://rabbitmq:5672" ]
      interval: 30s
      timeout: 30s
      retries: 3
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password

networks:
  default:
    driver: bridge
    internal: false
    attachable: true
    ipam:
      driver: default
      config:
        - subnet: 192.168.0.0/24
          gateway: 192.168.0.4